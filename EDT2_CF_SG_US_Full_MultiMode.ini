custom_proxy_group=♻️ 自动测速`url-test`(🇸🇬|新加坡|狮城|獅城|Singapore|🇺🇸|美国|美國|美西|美东|美東|United States|Los Angeles|San Jose|Seattle|Silicon Valley|Dallas|Chicago|New York|Phoenix|Portland|Ashburn|Virginia|San Francisco|(?:^|[^A-Za-z])(?:SG|SGP|SIN|US|USA|LAX|SJC|SFO|SEA|DFW|ORD|JFK|EWR|IAD|PHX|PDX|ATL|MIA)(?:[-_ ]?\d+)?(?:$|[^A-Za-z]))`http://www.gstatic.com/generate_204`300,,50

; ==================== 策略组 ====================

; 总入口：优先自动测速，也可以切换故障转移、国家均衡或手动节点
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动测速`[]🔯 故障转移`[]🇸🇬 新加坡均衡`[]🇺🇸 美国均衡`[]🌐 新美均衡`[]🇸🇬 新加坡手选`[]🇺🇸 美国手选`[]☑️ 手动选择`[]DIRECT

; 全部节点手动选择
custom_proxy_group=☑️ 手动选择`select`.*

; 新加坡与美国节点识别表达式
; 新加坡：中文、国旗、SG/SIN 机场代码及英文名称
custom_proxy_group=🇸🇬 新加坡手选`select`(🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SG|SGP|SIN)(?:[-_ ]?\d+)?(?:$|[^A-Za-z]))
custom_proxy_group=🇸🇬 新加坡均衡`load-balance`(🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SG|SGP|SIN)(?:[-_ ]?\d+)?(?:$|[^A-Za-z]))`http://www.gstatic.com/generate_204`300,,50

; 美国：中文、国旗、US/USA、主要城市与机场代码
custom_proxy_group=🇺🇸 美国手选`select`(🇺🇸|美国|美國|美西|美东|美東|United States|Los Angeles|San Jose|Seattle|Silicon Valley|Dallas|Chicago|New York|Phoenix|Portland|Ashburn|Virginia|San Francisco|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|硅谷|矽谷|达拉斯|達拉斯|芝加哥|纽约|紐約|凤凰城|鳳凰城|波特兰|波特蘭|旧金山|舊金山|(?:^|[^A-Za-z])(?:US|USA|LAX|SJC|SFO|SEA|DFW|ORD|JFK|EWR|IAD|PHX|PDX|ATL|MIA)(?:[-_ ]?\d+)?(?:$|[^A-Za-z]))
custom_proxy_group=🇺🇸 美国均衡`load-balance`(🇺🇸|美国|美國|美西|美东|美東|United States|Los Angeles|San Jose|Seattle|Silicon Valley|Dallas|Chicago|New York|Phoenix|Portland|Ashburn|Virginia|San Francisco|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|硅谷|矽谷|达拉斯|達拉斯|芝加哥|纽约|紐約|凤凰城|鳳凰城|波特兰|波特蘭|旧金山|舊金山|(?:^|[^A-Za-z])(?:US|USA|LAX|SJC|SFO|SEA|DFW|ORD|JFK|EWR|IAD|PHX|PDX|ATL|MIA)(?:[-_ ]?\d+)?(?:$|[^A-Za-z]))`http://www.gstatic.com/generate_204`300,,100

